seed: 42
device: cuda
reproducibility:
  mode: strict
output_dir: outputs/research_corrected/official/controlled_resunet32_seed42
data:
  hdf5: data/processed/official/mcf_qpi_128_v2.h5
  phase_encoding: uint8
  resize_mode: fit_pad
  speckle_normalization: log_mean
  dynamic_range: 20.0
  domains: [digits, fashion]
  size: 128
  augmentation: &baseline_augmentation
    enabled: true
    gain: 0.10
    background: 0.02
    gaussian_noise: 0.01
    poisson_peak: 0.0
    blur_probability: 0.10
    max_shift_pixels: 1
    saturation_probability: 0.05
    dead_pixel_probability: 0.0002
loader: &loader
  batch_size: 32
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  drop_last: true
model:
  type: resunet
  base_channels: 32
  dropout: 0.10
  predict_uncertainty: true
loss: &loss
  phase_l1: 1.0
  phase_nll: 0.05
  gradient: 0.15
  ssim: 0.20
  pearson: 0.05
training: &training
  epochs: 80
  amp: true
  gradient_clip: 1.0
  early_stopping_patience: 0
  checkpoint_monitor: val_phase_l1
  optimizer:
    name: adamw
    lr: 0.00015
    weight_decay: 0.0001
  scheduler:
    name: cosine
    min_lr: 0.000001
evaluation:
  split: val
  mc_samples: 8
  amp: true
  bootstrap_samples: 2000
  save_predictions: true
