# 官方 split、seed42：一级 RVQ 相位先验，仅服务于一级 refiner 对照。
seed: 42
device: cuda
deterministic: false
output_dir: outputs/research_corrected/official/phase_rvqvae_rvq1_seed42

data:
  hdf5: data/processed/official/mcf_qpi_128_v2.h5
  phase_encoding: uint8
  resize_mode: fit_pad
  speckle_normalization: log_mean
  dynamic_range: 20.0
  domains: [digits, fashion]
  size: 128
  augmentation:
    enabled: false

loader:
  batch_size: 64
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true

model:
  latent_channels: 64
  base_channels: 32
  downsample_stages: 3
  codebook_size: 256
  num_quantizers: 1
  commitment_beta: 0.25
  dropout: 0.05

loss:
  l1: 1.0
  gradient: 0.15
  ssim: 0.20
  vq: 0.50

training:
  epochs: 60
  amp: true
  amp_dtype: float16
  gradient_clip: 1.0
  early_stopping_patience: 0
  checkpoint_monitor: val_l1
  optimizer:
    name: adamw
    lr: 0.0002
    weight_decay: 0.0001
  scheduler:
    name: cosine
    min_lr: 0.000002
