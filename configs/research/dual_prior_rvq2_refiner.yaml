# 官方 split、seed42：双域相位先验细节修正网络，两级 RVQ 方案。
seed: 42
device: cuda
reproducibility:
  mode: strict
output_dir: outputs/research_corrected/official/dual_prior_rvq2_refiner_seed42

data:
  hdf5: data/processed/official/mcf_qpi_128_v2.h5
  phase_encoding: uint8
  resize_mode: fit_pad
  speckle_normalization: log_mean
  dynamic_range: 20.0
  domains: [digits, fashion]
  size: 128
  augmentation:
    enabled: true
    gain: 0.15
    background: 0.03
    gaussian_noise: 0.015
    poisson_peak: 0.0
    blur_probability: 0.15
    max_shift_pixels: 1
    saturation_probability: 0.08
    dead_pixel_probability: 0.0005

loader:
  batch_size: 32
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  drop_last: true

model:
  type: dual_domain_prior_refiner
  phase_prior_checkpoint: outputs/research_corrected/official/phase_rvqvae_seed42/best.pt
  phase_prior_model:
    latent_channels: 64
    base_channels: 32
    downsample_stages: 3
    codebook_size: 256
    num_quantizers: 2
    commitment_beta: 0.25
    dropout: 0.05
  base_channels: 32
  dropout: 0.10
  residual_scale: 0.15
  detail_scale_max: 0.25
  detail_scale_init: 0.05
  freeze_prior_encoder: true
  freeze_codebook: true
  freeze_decoder: false
  use_spatial: true
  use_frequency: true
  use_quantization: true

forward_twin:
  enabled: false

loss:
  phase_l1: 1.0
  phase_nll: 0.05
  gradient: 0.15
  ssim: 0.20
  pearson: 0.05
  vq: 0.05
  token: 0.15
  latent: 0.10
  residual: 0.01
  cycle_l1: 0.0
  cycle_spectral: 0.0

training:
  epochs: 80
  amp: true
  gradient_clip: 1.0
  early_stopping_patience: 0
  checkpoint_monitor: val_phase_l1
  optimizer:
    name: adamw
    lr: 0.00015
    weight_decay: 0.0001
  scheduler:
    name: cosine
    min_lr: 0.000001

evaluation:
  split: val
  mc_samples: 8
  amp: true
  bootstrap_samples: 2000
  save_predictions: true
