seed: 7
device: auto
deterministic: false
output_dir: outputs/smoke/phase_rvqvae

data:
  hdf5: data/smoke/mcf_smoke_64.h5
  domains: [digits, fashion]
  size: 64
  augmentation:
    enabled: false

loader:
  batch_size: 8
  num_workers: 0
  pin_memory: true
  drop_last: false

model:
  latent_channels: 16
  base_channels: 8
  downsample_stages: 3
  codebook_size: 32
  num_quantizers: 2
  commitment_beta: 0.25
  dropout: 0.0

loss:
  l1: 1.0
  gradient: 0.1
  ssim: 0.1
  vq: 0.5

training:
  epochs: 1
  amp: true
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.0001
  scheduler:
    name: none
  gradient_clip: 1.0
  max_train_batches: 2
  max_val_batches: 1
  early_stopping_patience: 0
