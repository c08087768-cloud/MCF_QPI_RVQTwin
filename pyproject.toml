[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcf-qpi-rvqtwin"
version = "0.2.0"
description = "MCF-QPI real-speckle phase reconstruction research framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Research scaffold generated for the user"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pillow>=10.0",
  "h5py>=3.9",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "requests>=2.31",
  "scikit-image>=0.22",
  "matplotlib>=3.8",
  "tensorboard>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
